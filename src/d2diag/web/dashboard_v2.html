<!DOCTYPE html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D2 Diag</title>
<style>
/* Astryx neutral theme (facebook/astryx) — embedded as plain CSS variables.
   Figtree via CDN with a system-font fallback (garage without network → the fallback applies). */
@import url("https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap");
:root{
  --font-base:Figtree,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --radius-md:10px; --radius-sm:4px;
  --bg-surface:#fff; --bg-body:#f1f1f1; --bg-card:#fff; --bg-muted:#f1f1f1;
  --accent:#262626; --on-accent:#fff;
  --fg:#171717; --fg2:#525252; --fg-dis:#a3a3a3;
  --border:#00000014; --border-emph:#d4d4d4;
  --success:#007004; --error:#a50c25; --warning:#745b00;
  --bg-red:#facecb; --bd-red:#e6bab8; --ic-red:#89001a;
  --bg-yellow:#f8da9d; --bd-yellow:#e4c279; --ic-yellow:#584400;
  --bg-green:#c5e5c0; --bd-green:#b2d1ac; --ic-green:#0c5700;
  --bg-blue:#c4ddfb; --bd-blue:#b1c9e7; --ic-blue:#00458c;
}
:root[data-theme="dark"]{
  --bg-surface:#262626; --bg-body:#1b1b1b; --bg-card:#1b1b1b; --bg-muted:#1b1b1b;
  --accent:#ebebeb; --on-accent:#171717;
  --fg:#fafafa; --fg2:#a3a3a3; --fg-dis:#525252;
  --border:#ffffff1a; --border-emph:#525252;
  --success:#9fe59b; --error:#ffc6c1; --warning:#fdcf4f;
  --bg-red:#ff9e973d; --bd-red:#ff6f6c; --ic-red:#ff9e97;
  --bg-yellow:#deb4333d; --bd-yellow:#c0990e; --ic-yellow:#deb433;
  --bg-green:#84c9803d; --bd-green:#69ad67; --ic-green:#84c980;
  --bg-blue:#9eb7ff3d; --bd-blue:#6d9cfe; --ic-blue:#9eb7ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg-body)}
::-webkit-scrollbar{width:0;height:0}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.3}}
body{font-family:var(--font-base);color:var(--fg);font-size:14px;line-height:20px;font-variant-numeric:tabular-nums}
/* height:100dvh = the actual visible area on mobile (100vh counts the area behind
   the browser's toolbar → the nav ended up below the fold and "scrolled away").
   100vh first as a fallback for older browsers, dvh wins where it is supported. */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:900px;margin:0 auto;background:var(--bg-body);overflow:hidden}
header{display:flex;flex-shrink:0;align-items:center;gap:12px;padding:8px 16px;min-height:56px;background:var(--bg-surface);border-bottom:1px solid var(--border)}
.htitle{font-size:12px;font-weight:700}
.hsub{font-size:12px;color:var(--fg-dis)}
.pill{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:10px;border:1px solid var(--border-emph);background:var(--bg-surface)}
.pdot{width:8px;height:8px;border-radius:9999px;background:var(--fg-dis)}
.chip{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border-emph);border-radius:10px;background:var(--bg-surface);color:var(--fg);cursor:pointer}
main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
h2{font-size:20px;line-height:28px;font-weight:700;margin:0}
.card{border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg-card);padding:12px 16px}
.kicker{font-size:12px;font-weight:600;letter-spacing:.15px;text-transform:uppercase;color:var(--fg2)}
.btn{min-height:48px;padding:0 16px;border:1px solid var(--border-emph);border-radius:10px;background:var(--bg-surface);color:var(--fg);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
.btn.accent{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.btn.rec{border-color:var(--bd-red);color:var(--ic-red)}
.row{display:flex;align-items:center;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;align-items:start}
.flag{display:inline-flex;align-items:center;height:16px;padding:0 5px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.3px}
.flag.ok{background:var(--bg-green);color:var(--ic-green)}
.flag.exp{background:var(--bg-yellow);color:var(--ic-yellow)}
.flag.lo,.flag.hi{background:var(--bg-red);color:var(--ic-red)}
.flag.sus{background:var(--bg-yellow);color:var(--ic-yellow)}
.ro.sus .ro-val{color:var(--fg-dis);text-decoration:line-through}
.ro{border:1px solid var(--border);border-radius:10px;background:var(--bg-card);overflow:hidden}
.ro.dim{opacity:.5}
.ro-top{display:flex;align-items:center;gap:10px;padding:12px 14px}
.ro-lbl{font-size:18px;font-weight:600;color:var(--fg2);flex:1;min-width:0}
.ro-val{font-size:32px;font-weight:700;display:flex;align-items:baseline;justify-content:flex-end}
.ro-meta{padding:0 14px 10px;font-size:13px;color:var(--fg-dis);text-wrap:pretty;display:none}
.ro.open .ro-meta{display:block}
/* Shared value component — used by EVERY data card (Inputs rows + Drive tiles).
   The number is right-aligned and the unit sits after it; because the value block
   is right-anchored (label takes the slack) and uses tabular-nums, the unit and
   digits never jump when e.g. rpm goes 999 -> 1000. ONE place to change. */
.cv-num{font-variant-numeric:tabular-nums;text-align:right}
.cv-unit{font-size:.5em;color:var(--fg2);font-weight:600;margin-left:.18em;white-space:nowrap}
/* In-car use is on a phone — make readouts big. Extra bump on narrow screens. */
@media (max-width:600px){
  .ro-lbl{font-size:20px}
  .ro-val{font-size:40px;line-height:1.05}
}
.infobtn{border:0;background:transparent;color:var(--fg-dis);font-size:13px;cursor:pointer;padding:2px 4px;line-height:1}
.ro.open .infobtn{color:var(--ic-blue)}
/* Driver's Dashboard — curated tiles that fill the screen height so it never
   scrolls in phone portrait. grid-auto-rows:1fr splits the height evenly.
   Values are right-aligned (unit fixed) via the shared .cv-* component. */
/* Spanning widget grid: digital fields = 1 cell (2-per-row bar), analog gauge =
   span 2×2 (full width, square-ish). grid-auto-rows:1fr fills the height → no scroll. */
.drive{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:10px}
.dtile{border:1px solid var(--border);border-radius:14px;background:var(--bg-card);display:flex;
  flex-direction:column;justify-content:flex-start;align-items:flex-start;gap:6px;padding:12px 14px;min-height:0;overflow:hidden}
.dtile.warn{border-color:var(--bd-red);background:var(--bg-red)}
/* Card composition: small label top-left, big value below-left (not centered, not split). */
.dlabel{font-size:16px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--fg2)}
.dval{font-size:clamp(30px,10vw,54px);font-weight:800;line-height:1;display:flex;align-items:baseline;justify-content:flex-start}
.dval .cv-num{min-width:3ch}   /* reserve width so the unit never jumps (89 -> 100) */
/* Analog gauge tile (2×2) — a 270° arc that fills the value from gmin..gmax. */
.dtile.gauge{align-items:stretch;justify-content:flex-start}
.gwrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.gsvg{height:100%;max-height:100%;max-width:100%;width:auto;aspect-ratio:1/1}
.gtrack{fill:none;stroke:var(--border);stroke-width:9;stroke-linecap:round}
.gval{fill:none;stroke:var(--ic-blue);stroke-width:9;stroke-linecap:round;transition:stroke-dasharray .3s ease}
.gnum{fill:var(--fg);font-size:24px;font-weight:800;text-anchor:middle;font-variant-numeric:tabular-nums}
.gunit{fill:var(--fg2);font-size:10px;font-weight:600;text-anchor:middle;letter-spacing:.5px}
.iconbtn{border:1px solid var(--border-emph);background:var(--bg-surface);color:var(--fg2);border-radius:9999px;height:32px;padding:0 12px;display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.iconbtn.rec{border-color:var(--bd-red);color:var(--ic-red)}
.iconbtn .d{width:8px;height:8px;border-radius:9999px;background:currentColor}
.iconbtn.rec .d{animation:blink 1s infinite}
.chanwrap{display:flex;flex-wrap:wrap;gap:8px}
.chan{min-height:40px;padding:0 12px;display:flex;align-items:center;gap:8px;border:1px solid var(--border-emph);border-radius:10px;background:var(--bg-surface);color:var(--fg2);font-size:12px;font-weight:600;cursor:pointer}
.chan.on{color:var(--fg);border-color:var(--accent)}
nav{display:flex;flex-shrink:0;background:var(--bg-surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-height:56px;border:0;background:transparent;color:var(--fg-dis);font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0}
nav button.on{color:var(--fg)}
nav .nd{width:5px;height:5px;border-radius:9999px;background:currentColor}
.empty{padding:40px 16px;text-align:center;color:var(--fg2);display:flex;flex-direction:column;gap:8px;align-items:center}
.pretty{text-wrap:pretty;max-width:40ch}
.comingrow{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px dashed var(--border-emph);border-radius:10px;color:var(--fg-dis)}
.comingrow .tag{margin-left:auto;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.overlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column}
.sheet{position:absolute;inset:0;z-index:30;background:var(--color-overlay,rgba(0,0,0,.6));display:flex;flex-direction:column;justify-content:flex-end}
.sheet-body{background:var(--bg-surface);border-top:1px solid var(--border);border-radius:12px 12px 0 0;padding:16px;display:flex;flex-direction:column;gap:16px;max-height:82%;overflow-y:auto}
.grip{width:32px;height:4px;border-radius:9999px;background:var(--fg-dis);align-self:center}
.opt{display:flex;align-items:flex-start;gap:12px;min-height:56px;padding:12px 16px;border:1px solid var(--border);border-radius:10px;background:var(--bg-card);color:var(--fg);text-align:left;cursor:pointer;width:100%;font-family:inherit;font-size:14px}
.opt.on{border-color:var(--accent)}
.opt .rr{width:24px;height:24px;flex:0 0 24px;margin-top:2px;border-radius:9999px;border:1px solid var(--border-emph);display:flex;align-items:center;justify-content:center}
.opt.on .rr{border-color:var(--accent)}
.opt .rr>i{width:12px;height:12px;border-radius:9999px;background:transparent}
.opt.on .rr>i{background:var(--accent)}
.opt .on-name{font-weight:700}
.opt .on-desc{font-size:12px;color:var(--fg2);text-wrap:pretty}
.tgl{width:48px;height:28px;border:1px solid var(--border-emph);border-radius:9999px;background:var(--bg-muted);display:flex;align-items:center;padding:2px;cursor:pointer}
.tgl.on{background:var(--bg-green);border-color:var(--bd-green);justify-content:flex-end}
.tgl>span{width:20px;height:20px;border-radius:9999px;background:var(--fg2)}
.tgl.on>span{background:var(--ic-green)}
#toast{position:absolute;left:16px;right:16px;bottom:76px;z-index:40;padding:12px 16px;border-radius:10px;
  background:var(--bg-surface);border:1px solid var(--border);color:var(--fg);font-size:13px;font-weight:600;
  box-shadow:0 6px 24px rgba(0,0,0,.35);opacity:0;transform:translateY(8px);transition:.15s;pointer-events:none}
#toast.show{opacity:1;transform:none}
#toast.bad{border-color:var(--bd-red);color:var(--ic-red)}
.mtag{display:inline-flex;align-items:center;height:20px;padding:0 5px;border-radius:4px;font-size:11px;font-weight:700}
</style>
</head>
<body>
<div class="app">
  <header>
    <div style="min-width:0">
      <div class="htitle" id="h-title">D2 Diag</div>
      <div class="hsub" id="h-sub">—</div>
    </div>
    <div class="row" style="margin-left:auto">
      <div class="pill"><span class="pdot" id="pill-dot"></span><span id="pill-label" style="font-size:12px;font-weight:700">—</span></div>
      <button class="chip" id="setbtn" title="Settings">⚙</button>
    </div>
  </header>

  <div id="expbanner" style="display:none;align-items:center;gap:8px;padding:5px 16px;background:var(--bg-card);border-bottom:1px solid var(--bd-yellow)">
    <span class="pdot" style="background:var(--ic-yellow)"></span>
    <span style="font-size:12px;font-weight:700">Experimental mode — unverified routines enabled</span>
  </div>

  <main id="view"></main>

  <nav id="nav"></nav>
</div>
<script>
const $ = s => document.querySelector(s);
let _toastT=null;
function toast(msg, bad){
  let el=document.getElementById("toast");
  if(!el){ el=document.createElement("div"); el.id="toast"; document.querySelector(".app").appendChild(el); }
  el.textContent=msg; el.className="show"+(bad?" bad":"");
  clearTimeout(_toastT); _toastT=setTimeout(()=>el.className="",3200);
}
window.toast=toast;
// ---- admin mode: ONE app, ONE routing. /admin serves the same page and reveals
// the mapping tabs. Basic Auth (entered at /admin) is carried along to the
// gated endpoints automatically. ----
const ADMIN = /^\/admin\/?$/.test(location.pathname);

// ---- screen registry: ONE pattern for all tabs. One entry = {label, render
// (→HTML), mount (optional event wiring after injection), admin (only on /admin)}.
// Add a tab = one row here. render()/renderNav() are never touched again. ----
const SCREENS = {
  drive:   {label:"Drive",      render:renderDrive},
  connect: {label:"Connect",   render:renderConnect,   mount:mountConnect},
  faults:  {label:"Faults",     render:renderFaults,    mount:mountFaults},
  inputs:  {label:"Inputs",     render:renderInputs,    mount:mountInputs},
  outputs: {label:"Outputs",    render:renderOutputs},
  utils:   {label:"Utilities",  render:renderUtilities},
  map:     {label:"Map",        render:renderMap,       mount:mountMap,     admin:true},
  capture: {label:"Capture",    render:renderCapture,   mount:mountCapture, admin:true},
};
const TAB_ORDER = ["drive","connect","faults","inputs","outputs","utils","map","capture"];
function tabList(){ return TAB_ORDER.filter(id => SCREENS[id] && (ADMIN || !SCREENS[id].admin)); }
let TAB = ADMIN ? "map" : "drive";

// ---- preferences (localStorage) + community state ----
const PREFS = Object.assign({trust:"trusted", consentDone:false, share:null, theme:"dark"},
  JSON.parse(localStorage.getItem("d2diag.v2")||"{}"));
// Per-user unit choices — the display layer converts from the store's base units
// (°C, km/h) at render time. Extend here (pressure, fuel economy…) as needed.
PREFS.units = Object.assign({temp:"C", dist:"km"}, PREFS.units||{});
function savePrefs(){ localStorage.setItem("d2diag.v2", JSON.stringify(PREFS)); }
document.documentElement.setAttribute("data-theme", PREFS.theme);
let COMMUNITY = null;
function loadCommunity(){ fetch("/community").then(r=>r.json()).then(d=>{COMMUNITY=d;}).catch(()=>{}); }
loadCommunity();

// ---- signal metadata (group + description). Mirrors dashboard.html's META. ----
const GROUPS = ["Engine","Temperatures","Fuelling","Pressures","Accelerator","Ride height","Wheels","Electrical","Inputs","Other"];
const META = {
  rpm:{g:"Engine",d:"Engine speed."},
  rpm_error:{g:"Engine",d:"Idle-speed error: target minus actual idle rpm."},
  speed:{g:"Engine",d:"Road speed from the ECU."},
  coolant_temp:{g:"Temperatures",d:"Coolant temperature. Normal 86–95 °C; above 105 = overheating."},
  air_temp:{g:"Temperatures",d:"Intake air temperature."},
  fuel_temp:{g:"Temperatures",d:"Fuel temperature — ~70–80 °C warm, 10–15 below coolant."},
  ext_temp:{g:"Temperatures",d:"External temp sensor — not fitted; phantom constant. Ignore."},
  balance_1:{g:"Fuelling",d:"Cylinder 1 fuelling correction. ±4 healthy; +6…+15 = weak cylinder."},
  balance_2:{g:"Fuelling",d:"Cylinder 2 fuelling correction. ±4 healthy."},
  balance_3:{g:"Fuelling",d:"Cylinder 3 fuelling correction. ±4 healthy."},
  balance_4:{g:"Fuelling",d:"Cylinder 4 fuelling correction. ±4 healthy."},
  balance_5:{g:"Fuelling",d:"Cylinder 5 fuelling correction. ±4 healthy."},
  manifold_press:{g:"Pressures",d:"Turbo / boost pressure. Idle ~1.0 bar; full load 2.0–2.2; overboost-cut >2.42."},
  ambient_press_1:{g:"Pressures",d:"Atmospheric pressure — ~1.0 bar at sea level."},
  ambient_press_2:{g:"Pressures",d:"Atmospheric pressure (second reading)."},
  maf_raw:{g:"Engine",d:"Raw field at 1C@4. NOT the MAF — reads 57 key-on, 0 while running. Real air-flow LID still unmapped."},
  accel_way1:{g:"Accelerator",d:"Pedal track 1: ~0.3 V idle → ~4.7 V full."},
  accel_way2:{g:"Accelerator",d:"Pedal track 2: mirror of track 1 — ~4.7 V idle → ~0.3 V full."},
  accel_way3:{g:"Accelerator",d:"Pedal track 3 — Euro 3 only; reads 0 on Euro 2."},
  accel_supply:{g:"Accelerator",d:"5 V reference — rock-solid 5.0 V ±0.1."},
  battery:{g:"Electrical",d:"System voltage. 13.8–14.4 V running; below 13 = charging fault."},
  height_left:{g:"Ride height",d:"Left ride-height sensor (raw 0–255). Normal ~110–135; L≈R on level ground."},
  height_right:{g:"Ride height",d:"Right ride-height sensor (raw 0–255). Normal ~110–135."},
  height_left_mm:{g:"Ride height",d:"Left ride height in mm (derived)."},
  height_right_mm:{g:"Ride height",d:"Right ride height in mm (derived)."},
  any_door:{g:"Inputs",d:"Any door open. SLABS won't adjust suspension with a door open. Normal: closed."},
  ecu_supply:{g:"Electrical",d:"Internal SLABS ECU supply voltage."},
  wheel_speed_fl:{g:"Wheels",d:"Front-left wheel speed (raw ~124 stationary). ⚠ Wheel order unconfirmed."},
  wheel_speed_fr:{g:"Wheels",d:"Front-right wheel speed (raw ~124 stationary). ⚠ Wheel order unconfirmed."},
  wheel_speed_rl:{g:"Wheels",d:"Rear-left wheel speed. ⚠ Wheel order unconfirmed."},
  wheel_speed_rr:{g:"Wheels",d:"Rear-right wheel speed. ⚠ Wheel order unconfirmed."},
  abs_sensor_fl:{g:"Wheels",d:"Front-left ABS sensor voltage (~2.3 V). ⚠ Order unconfirmed."},
  abs_sensor_fr:{g:"Wheels",d:"Front-right ABS sensor voltage (~2.3 V). ⚠ Order unconfirmed."},
  abs_sensor_rl:{g:"Wheels",d:"Rear-left ABS sensor voltage. ⚠ Order unconfirmed."},
  abs_sensor_rr:{g:"Wheels",d:"Rear-right ABS sensor voltage. ⚠ Order unconfirmed."},
};
const LABELS = {
  rpm:"RPM",speed:"Speed",battery:"Battery",coolant_temp:"Coolant",air_temp:"Intake air",
  fuel_temp:"Fuel",ext_temp:"External temp",manifold_press:"Turbo pressure",maf_raw:"1C@4 (unknown)",
  ambient_press_1:"Ambient pressure",ambient_press_2:"Ambient pressure 2",rpm_error:"RPM error",
  balance_1:"Injector 1",balance_2:"Injector 2",balance_3:"Injector 3",balance_4:"Injector 4",balance_5:"Injector 5",
  accel_way1:"Pedal track 1",accel_way2:"Pedal track 2",accel_way3:"Pedal track 3",accel_supply:"Pedal supply",
  height_left:"Height left (raw)",height_right:"Height right (raw)",height_left_mm:"Height left",height_right_mm:"Height right",
  any_door:"Door open",ecu_supply:"ECU supply",
  wheel_speed_fl:"Wheel speed FL",wheel_speed_fr:"Wheel speed FR",wheel_speed_rl:"Wheel speed RL",wheel_speed_rr:"Wheel speed RR",
  abs_sensor_fl:"ABS sensor FL",abs_sensor_fr:"ABS sensor FR",abs_sensor_rl:"ABS sensor RL",abs_sensor_rr:"ABS sensor RR",
};
const groupOf = n => (META[n]&&META[n].g) || "Other";
const MODULE_NAME = {motor:"TD5 (engine)", slabs:"SLABS (ABS + air suspension)"};

// ---- state ----
let SNAP = null, FIELDS = {}, MODULE = "motor";
const HISTORY = {};           // name → array of {t, v} (ring buffer ~60 s)
const OPEN = new Set();       // which readouts have their info expanded (survives redraw)
function toggleInfo(n){ OPEN.has(n)?OPEN.delete(n):OPEN.add(n); render(); }
window.toggleInfo=toggleInfo;
let SEQ = [];                 // connection sequence: {phase, t} — accumulated connect_phase
let SEQ_DONE = false;
const PLOT = new Set();       // selected channels for the trend graph
const HISTLEN = 60;
let recording = false;

// ---- data ----
function loadFields(mod){
  fetch("/fields?module="+mod).then(r=>r.json()).then(d=>{
    FIELDS[mod] = {}; (d.fields||[]).forEach(f=>{ FIELDS[mod][f.name]={u:f.unit,c:f.c,limits:f.limits}; });
    if(TAB==="inputs") render();
  }).catch(()=>{});
}
function pushHistory(sig){
  const t = Date.now();
  for(const [n,s] of Object.entries(sig||{})){
    if(typeof s.v !== "number") continue;
    (HISTORY[n] ||= []).push({t,v:s.v});
    if(HISTORY[n].length > HISTLEN) HISTORY[n].shift();
  }
}
function onSnap(d){
  const mod = d.module || MODULE;
  if(mod !== MODULE){ MODULE = mod; for(const k in HISTORY) delete HISTORY[k]; PLOT.clear(); SEQ=[]; SEQ_DONE=false; }  // new module → new history + sequence
  // Connection sequence: capture each new connect_phase while we connect.
  const ph = d.connect_phase;
  if(ph && (!SEQ.length || SEQ[SEQ.length-1].phase!==ph)){ SEQ.push({phase:ph, t:Date.now()}); SEQ_DONE=false; }
  if(d.status==="connected" && SEQ.length && !SEQ_DONE){ SEQ.push({phase:"session established", t:Date.now(), ok:true}); SEQ_DONE=true; }
  if(d.status==="error"){ SEQ_DONE=false; }
  SNAP = d;
  if(d.signals) pushHistory(d.signals);
  if(d.logging) recording = !!d.logging.recording;
  if(!FIELDS[mod]) loadFields(mod);
  renderHeader();
  if(TAB==="drive" || TAB==="inputs") render();   // live-value tabs refresh each poll
  if(d.status==="connected") maybeShowFaults();     // startup + new-fault modal
}
const es = new EventSource("/events");
es.onmessage = e => { try{ onSnap(JSON.parse(e.data)); }catch(_){} };
fetch("/snapshot").then(r=>r.json()).then(onSnap).catch(()=>{});

// ---- confidence / status helpers ----
function flagFor(n, s, f){
  const st = s && s.s;
  if(st==="suspect") return {cls:"sus",txt:"SUSPECT"};
  if(st==="low") return {cls:"lo",txt:"LOW"};
  if(st==="high") return {cls:"hi",txt:"HIGH"};
  const c = (s&&s.c) || (f&&f.c);
  if(c==="kandidat") return {cls:"exp",txt:"EXP"};

function fmt(v){ return (typeof v==="number") ? (Math.abs(v)>=100?v.toFixed(0):v.toFixed(1)) : "–"; }
// Convert a base-unit value to the user's chosen unit (Settings → Units).
function convUnit(v, unit){
  const U = PREFS.units||{};
  if(unit==="°C" && U.temp==="F") return {v:v*9/5+32, unit:"°F"};
  if(unit==="km/h" && U.dist==="mi") return {v:v*0.621371, unit:"mph"};
  if(unit==="km"   && U.dist==="mi") return {v:v*0.621371, unit:"mi"};
  return {v, unit};
}
// THE shared value renderer — number (right-aligned, tabular) + fixed unit. Every
// data card uses this so unit/formatting/conversion live in exactly one place.
function renderValue(value, unit, opts={}){
  let v = value, u = unit||"";
  if(typeof v==="number"){ const c=convUnit(v,u); v=c.v; u=c.unit; }
  let num;
  if(opts.dim) num="–";
  else if(v===null || v===undefined) num="–";
  else if(typeof v==="number") num=(opts.dec!=null ? v.toFixed(opts.dec) : fmt(v));
  else num=String(v);
  const showU = !opts.dim && num!=="–" && u;
  return `<span class="cv-num">${num}</span>${showU?`<span class="cv-unit">${u}</span>`:""}`;
}
// Current time HH:MM, 24h, no seconds — the car has no lit clock. Uses the phone's clock.
function clockHHMM(){ const d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
// Analog gauge: a 270° arc filled from gmin..gmax (gap at the bottom). The circle
// path starts at 3 o'clock; rotate(135) opens the gap downward.
function gaugeSvg(value, min, max, unit, dec){
  const r=40, C=2*Math.PI*r, sweep=0.75, arc=C*sweep;
  const frac = (typeof value==="number") ? Math.max(0, Math.min(1,(value-min)/(max-min))) : 0;
  const num = (typeof value==="number") ? (dec!=null?value.toFixed(dec):fmt(value)) : "–";
  return `<svg viewBox="0 0 100 100" class="gsvg">
    <circle cx="50" cy="50" r="${r}" class="gtrack" stroke-dasharray="${arc.toFixed(1)} ${C.toFixed(1)}" transform="rotate(135 50 50)"/>
    <circle cx="50" cy="50" r="${r}" class="gval" stroke-dasharray="${(arc*frac).toFixed(1)} ${C.toFixed(1)}" transform="rotate(135 50 50)"/>
    <text x="50" y="54" class="gnum">${num}</text>
    <text x="50" y="69" class="gunit">${unit||""}</text>
  </svg>`;
}
// The single data card. variant "tile" (Drive digital), "gauge" (Drive 2×2 analog),
// or "row" (Inputs, adds flag/info/meta).
function dataCard(spec){
  if(spec.variant==="gauge")
    return `<div class="dtile gauge" style="grid-column:span 2;grid-row:span 2">
      <div class="dlabel">${spec.label}</div>
      <div class="gwrap">${gaugeSvg(spec.value, spec.gmin, spec.gmax, spec.unit, spec.dec)}</div></div>`;
  const val = renderValue(spec.value, spec.unit, {dec:spec.dec, dim:spec.dim});
  if(spec.variant==="tile")
    return `<div class="dtile${spec.warn?' warn':''}"><div class="dlabel">${spec.label}</div><div class="dval">${val}</div></div>`;
  return `<div class="ro${spec.dim?' dim':''}${spec.open?' open':''}${spec.sus?' sus':''}">
    <div class="ro-top">
      <div class="ro-lbl">${spec.label}</div>
      <div class="ro-val">${val}</div>
      <span class="flag ${spec.flag.cls}">${spec.dim?'EXP':spec.flag.txt}</span>
      ${spec.meta?`<button class="infobtn" onclick="toggleInfo('${spec.id}')">ⓘ</button>`:''}
    </div>
    ${spec.meta?`<div class="ro-meta">${spec.meta}</div>`:''}
  </div>`;
}

function trendSvg(){
  const chans = [...PLOT];
  const colors = ["var(--ic-blue)","var(--ic-green)","var(--ic-yellow)"];
  let lines = "";
  chans.slice(0,3).forEach((n,i)=>{
    const h = HISTORY[n]||[];
    if(h.length<2) return;
    const vs = h.map(p=>p.v), lo=Math.min(...vs), hi=Math.max(...vs), span=(hi-lo)||1;
    const pts = h.map((p,j)=>{
      const x = (j/(HISTLEN-1))*640;
      const y = 150 - ((p.v-lo)/span)*140;
      return x.toFixed(1)+","+y.toFixed(1);
    }).join(" ");
    lines += `<polyline fill="none" stroke="${colors[i]}" stroke-width="2" points="${pts}"></polyline>`;
  });
  const legend = chans.slice(0,3).map((n,i)=>{
    const h=HISTORY[n]||[], vs=h.map(p=>p.v);
    const cur = vs.length? vs[vs.length-1] : null;
    const rng = vs.length? `${Math.min(...vs).toFixed(1)}–${Math.max(...vs).toFixed(1)}` : "";

    <svg viewBox="0 0 640 160" preserveAspectRatio="none" style="width:100%;height:150px;display:block">
      <line x1="0" y1="40" x2="640" y2="40" stroke="var(--border)"/><line x1="0" y1="80" x2="640" y2="80" stroke="var(--border)"/><line x1="0" y1="120" x2="640" y2="120" stroke="var(--border)"/>
      ${lines}
    </svg>
    <div class="row" style="justify-content:space-between;font-size:12px;color:var(--fg-dis)"><span>−60 s</span><span>−30 s</span><span>NOW</span></div>

}

function mountCapture(){
  const rd=$("#capread"); if(rd) rd.onclick=async()=>{

      if(!raw){ toast("no answer for 21 "+lid,true); return; }

        body:JSON.stringify(rec)})).json();

function parseFault(str){
  // "027: shuttle valve switch — electrical failure (Current)" → {text, tag, raw}
  const mtag = str.match(/\(([^)]+)\)\s*$/);
  const tag = mtag ? mtag[1] : "";
  let text = str.replace(/\s*\([^)]+\)\s*$/, "");
  let raw = "";
  const mraw = text.match(/^(byte\d+\.bit\d+|[0-9A-Fa-f]{2,3}[:\-][0-9A-Fa-f-]+)\s*/);
  if(mraw){ raw = mraw[1]; }
  const mcode = text.match(/^(\d{3}):\s*/);
  if(mcode){ raw = mcode[1]; text = text.replace(/^\d{3}:\s*/, ""); }
  return {text, tag, raw, current:/current/i.test(tag)};
}

  render();
}
function setMode(v){
  fetch("/command",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({action:"set_mode",params:{mode:v}})}).catch(()=>{});
  closeSheet();
}
function setTheme(v){ PREFS.theme=v; savePrefs(); document.documentElement.setAttribute("data-theme",v); openSettings(); }
function setUnit(k,v){ PREFS.units=Object.assign({}, PREFS.units, {[k]:v}); savePrefs(); render(); openSettings(); }
window.setTrust=setTrust; window.setShare=setShare; window.setMode=setMode; window.setTheme=setTheme; window.setUnit=setUnit;

function closeSheet(){ document.getElementById("sheet")?.remove(); }
window.closeSheet=closeSheet;
function openSettings(){
  closeSheet();
  const share = COMMUNITY ? !!COMMUNITY.consent : (PREFS.share===true);
  const mode = (SNAP&&SNAP.mode)||"mock";
  const U = PREFS.units||{};
  const el = document.createElement("div"); el.className="sheet"; el.id="sheet";
  el.innerHTML = `<div style="flex:1" onclick="closeSheet()"></div>
    <div class="sheet-body" onclick="event.stopPropagation()">
      <div class="grip"></div><div style="font-size:20px;font-weight:700">Settings</div>
      <div><div class="kicker" style="margin-bottom:8px">Trust</div>
        ${radioOpt("Trusted","Only routines proven on the car. Unverified stays hidden.",PREFS.trust==="trusted","setTrust('trusted')")}
        <div style="height:8px"></div>
        ${radioOpt("Experimental","Exposes partial modules and unverified tests. They can misbehave.",PREFS.trust==="experimental","setTrust('experimental')")}</div>
      <div><div class="kicker" style="margin-bottom:8px">Data source</div>
        <div style="display:flex;gap:8px">
          <button class="btn ${mode==='mock'?'accent':''}" style="flex:1" onclick="setMode('mock')">Mock</button>
          <button class="btn ${mode==='live'?'accent':''}" style="flex:1" onclick="setMode('live')">Live vehicle</button></div></div>
      <div><div class="kicker" style="margin-bottom:8px">Data sharing</div>
        <div class="row card" style="gap:12px">
          <div style="flex:1;min-width:0"><div style="font-weight:700">Share anonymous traces</div>
            <div style="font-size:12px;color:var(--fg2);text-wrap:pretty">Raw fault blocks and unmapped bits — no VIN, no location, no identifiers.</div></div>
          <div class="tgl ${share?'on':''}" onclick="setShare(${!share})"><span></span></div></div></div>
      <div><div class="kicker" style="margin-bottom:8px">Display</div>
        <div style="display:flex;gap:8px">
          <button class="btn ${PREFS.theme==='light'?'accent':''}" style="flex:1" onclick="setTheme('light')">Light</button>
          <button class="btn ${PREFS.theme==='dark'?'accent':''}" style="flex:1" onclick="setTheme('dark')">Dark</button></div></div>
      <div><div class="kicker" style="margin-bottom:8px">Units</div>
        <div style="display:flex;gap:8px;margin-bottom:8px">
          <button class="btn ${U.temp==='C'?'accent':''}" style="flex:1" onclick="setUnit('temp','C')">°C</button>
          <button class="btn ${U.temp==='F'?'accent':''}" style="flex:1" onclick="setUnit('temp','F')">°F</button></div>
        <div style="display:flex;gap:8px">
          <button class="btn ${U.dist==='km'?'accent':''}" style="flex:1" onclick="setUnit('dist','km')">km · km/h</button>
          <button class="btn ${U.dist==='mi'?'accent':''}" style="flex:1" onclick="setUnit('dist','mi')">miles · mph</button></div></div>
      <div><div class="kicker" style="margin-bottom:8px">Advanced</div>
        <a class="btn" href="/admin" style="display:block;text-align:center;text-decoration:none">Mapping console (admin)</a>
        <div style="font-size:12px;color:var(--fg2);text-wrap:pretty;margin-top:6px">Same app, admin mode — adds the Map tab (coverage). Capture, docs and signal editing come next. Password protected.</div></div>
      ${(SNAP&&SNAP.allow_shutdown) ? `<div><div class="kicker" style="margin-bottom:8px">Power</div>
        <button class="btn" style="display:block;width:100%;border-color:var(--bd-red);color:var(--ic-red)" onclick="shutdownPi()">Shut down Pi</button>
        <div style="font-size:12px;color:var(--fg2);text-wrap:pretty;margin-top:6px">Powers off the Raspberry Pi safely, then wait for the green LED to stop before cutting power. Stopgap until a proper power control exists.</div></div>` : ''}
      <button class="btn accent" onclick="closeSheet()">Done</button></div>`;
  document.querySelector(".app").appendChild(el);
}
window.openSettings=openSettings;

async function shutdownPi(){
  if(!confirm("Shut down the Pi now? The dashboard will go offline; wait for the green LED to stop before cutting power.")) return;
  try{
    const r = await (await fetch("/command",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"shutdown"})})).json();
    if(r.ok){ closeSheet(); toast("Shutting down the Pi…"); }
    else toast(r.error||"Shutdown refused", true);
  }catch(e){ closeSheet(); toast("Shutting down the Pi…"); }  // fetch drops as the Pi powers off — expected
}
window.shutdownPi=shutdownPi;

function acceptConsent(){
  if(PREFS.share===null) return;
  PREFS.consentDone=true; savePrefs();
  fetch("/community/consent",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({consent:PREFS.share===true})}).then(()=>loadCommunity()).catch(()=>{});
  document.getElementById("consent-ov")?.remove();
  render();
}
window.acceptConsent=acceptConsent;
function renderConsent(){
  if(document.getElementById("consent-ov")) { updateConsentBtn(); return; }
  const el=document.createElement("div"); el.className="overlay"; el.id="consent-ov";
  el.style.background="var(--bg-body)";
  el.innerHTML = `<div style="flex:1;overflow-y:auto;padding:24px 16px;display:flex;flex-direction:column;gap:16px">
      <div><div class="kicker">First start</div><div style="font-size:24px;line-height:32px;font-weight:700">Before you connect</div></div>
      <div style="font-size:14px;color:var(--fg2);text-wrap:pretty">This tool writes to real ECUs over the K-line. Two choices decide what it may do. Both change later in Settings.</div>
      <div><div class="kicker" style="margin-bottom:8px">Trust</div><div id="c-trust"></div></div>
      <div><div class="kicker" style="margin-bottom:8px">Data sharing</div><div id="c-share"></div>
        <div style="font-size:12px;color:var(--fg-dis);margin-top:8px;text-wrap:pretty">Sharing is off unless chosen here. Nothing leaves the device before this screen is answered.</div></div>
    </div>
    <div style="padding:16px;border-top:1px solid var(--border);background:var(--bg-surface);display:flex;flex-direction:column;gap:8px">
      <button class="btn" id="c-continue" onclick="acceptConsent()">Continue</button>
      <div id="c-hint" style="font-size:12px;color:var(--fg-dis);text-align:center"></div></div>`;
  document.querySelector(".app").appendChild(el);
  document.getElementById("c-trust").innerHTML =
    radioOpt("Trusted","Only routines proven on the car.",PREFS.trust==="trusted","setTrustC('trusted')")+
    '<div style="height:8px"></div>'+
    radioOpt("Experimental","Exposes partial modules and unverified tests.",PREFS.trust==="experimental","setTrustC('experimental')");
  document.getElementById("c-share").innerHTML =
    radioOpt("Share anonymous traces","Helps name unknown bits. No VIN, no location.",PREFS.share===true,"setShareC(true)")+
    '<div style="height:8px"></div>'+
    radioOpt("Don\'t share","Nothing leaves the device.",PREFS.share===false,"setShareC(false)");
  updateConsentBtn();
}
function setTrustC(v){ PREFS.trust=v; renderConsent2(); }
function setShareC(v){ PREFS.share=v; renderConsent2(); }
function renderConsent2(){ document.getElementById("consent-ov")?.remove(); renderConsent(); }
window.setTrustC=setTrustC; window.setShareC=setShareC;
function updateConsentBtn(){
  const btn=document.getElementById("c-continue"), hint=document.getElementById("c-hint");
  const ready = PREFS.share!==null;
  if(btn){ btn.className = "btn"+(ready?" accent":""); btn.style.opacity = ready?"1":".5"; btn.style.cursor=ready?"pointer":"not-allowed"; }
  if(hint) hint.textContent = ready ? ("Trust "+PREFS.trust+" · sharing "+(PREFS.share?"on":"off")+" · changeable in Settings.")
                                    : "Answer data sharing to continue.";
}

async function readBlock(lidsStr){
  const lids = lidsStr.split(/[ ,]+/).filter(Boolean);
  toast("reading "+lids.length+" LID(s)…");
  try{
    const r = await (await fetch("/command",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({action:"read_block",params:{lids}})})).json();
    const out = document.getElementById("dump");
    if(!r.ok){ toast("Error: "+(r.error||"?"),true); return; }
    const rows = Object.entries(r.raws||{}).map(([lid,hex])=>
      `<div class="row" style="font-family:ui-monospace,Menlo,monospace;font-size:12px;gap:12px">
        <span style="color:var(--ic-blue)">21 ${lid}</span><span style="flex:1;word-break:break-all">${hex.replace(/(..)/g,"$1 ")}</span></div>`).join("");
    if(out) out.innerHTML = rows || '<span style="color:var(--fg-dis)">no LID answered</span>';
    toast("read "+Object.keys(r.raws||{}).length+" LID(s)");
  }catch(e){ toast("network error",true); }
}
window.readBlock=readBlock;
function writeFaultsFile(){
  const faults=(SNAP&&SNAP.faults)||[], name=MODULE_NAME[MODULE]||MODULE;
  const now=new Date().toISOString().replace(/[:.]/g,"-").slice(0,19);
  const lines=["D2 Diag — fault report","Module: "+name,"Time:   "+new Date().toISOString(),
    "Codes:  "+faults.length,""].concat(faults.length?faults.map(f=>"  "+f):["  (no fault codes)"]);
  const blob=new Blob([lines.join("\n")+"\n"],{type:"text/plain"});
  const url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=`faults-${MODULE}-${now}.txt`; document.body.appendChild(a); a.click();
  a.remove(); URL.revokeObjectURL(url);
  toast("wrote faults-"+MODULE+"-"+now+".txt");
}
window.writeFaultsFile=writeFaultsFile;
const UTIL_LIDS = {
  motor: {ex:"09 0D 10 1A 1B 1C 40", note:"09 rpm · 1A temps · 1B pedal · 1C boost · 40 injector balance"},
  slabs: {ex:"54 43 50 44 56", note:"54 heights · 43 wheel speeds · 50 ABS sensors · 44 supply · 56 door"},
};
function renderUtilities(){
  const name = MODULE_NAME[MODULE]||MODULE, u = UTIL_LIDS[MODULE]||{ex:"",note:""};
  const connected = SNAP && SNAP.status==="connected";
  return `<div class="row"><h2>Utilities</h2><span style="font-size:12px;color:var(--fg2);margin-left:2px">· ${name}</span></div>
    <div class="card"><div class="kicker" style="margin-bottom:8px">Raw LID block dump</div>
      <div style="font-size:12px;color:var(--fg2);text-wrap:pretty;margin-bottom:8px">Read raw <span style="font-family:ui-monospace">21 xx</span> data straight off the ECU — read-only. ${u.note}</div>
      <div class="row" style="gap:8px">
        <input id="lidin" value="${u.ex}" placeholder="e.g. 54 43 50" style="flex:1;min-height:44px;padding:0 12px;border:1px solid var(--border-emph);border-radius:10px;background:var(--bg-surface);color:var(--fg);font-family:ui-monospace,Menlo,monospace;font-size:13px">
        <button class="btn accent" onclick="readBlock(document.getElementById('lidin').value)">Read</button></div>
      <div id="dump" style="margin-top:12px;display:flex;flex-direction:column;gap:4px"></div></div>
    ${comingCard("Coming", [
      {name:"ECU identifiers (1A — VIN, versions)",tag:"planned"},
      {name:"Routines & security status",tag:"planned"},
      {name:"Saved logs & reports",tag:"planned"}])}`;
}

function renderNav(){
  $("#nav").innerHTML = tabList().map(id=>
    `<button class="${id===TAB?'on':''}" data-tab="${id}"><span class="nd"></span>${SCREENS[id].label}</button>`).join("");
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ TAB=b.dataset.tab; renderNav(); render(); });
}
$("#setbtn").onclick=openSettings;
renderNav(); render();
</script>
</body>
</html>
