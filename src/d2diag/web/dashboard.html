<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Discovery 2 · diagnostik</title>
<style>
  :root {
    --bg:#0e1116; --card:#161b22; --card2:#1c232e; --fg:#e6edf3; --muted:#8b98a5;
    --accent:#4aa3ff; --ok:#3fb950; --warn:#d29922; --err:#f85149; --line:#262e3a;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:12px 16px; position:sticky; top:0; background:var(--bg); z-index:5; }
  header h1 { font-size:16px; margin:0; font-weight:650; }
  .pill { display:inline-flex; align-items:center; gap:7px; font-size:12px; color:var(--muted); }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--muted); }
  .dot.connected { background:var(--ok); } .dot.error { background:var(--err); }
  .dot.connecting { background:var(--warn); }
  /* flikar */
  .tabs { display:flex; gap:6px; padding:0 12px 10px; position:sticky; top:44px; background:var(--bg); z-index:4; }
  .tab { flex:1; text-align:center; padding:10px; border-radius:11px; background:var(--card);
    color:var(--muted); font-weight:600; font-size:14px; border:1px solid var(--line); cursor:pointer; }
  .tab.active { background:var(--accent); color:#04121f; border-color:var(--accent); }
  main { padding:4px 12px 40px; max-width:560px; margin:0 auto; }
  .view { display:none; } .view.active { display:block; }
  .hint { color:var(--muted); text-align:center; padding:40px 10px; font-size:14px; }
  section { margin-top:16px; }
  section h2 { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin:0 0 8px; }
  /* signalkort */
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .row { display:flex; justify-content:space-between; padding:9px 12px; background:var(--card); border-radius:9px; }
  .row .n { color:var(--muted); } .row .val { font-weight:650; } .u { color:var(--muted); font-size:.8em; }
  .s-low { color:var(--accent); } .s-high { color:var(--err); }
  .hero { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .card { background:var(--card); border-radius:12px; padding:12px 14px; }
  .card .k { color:var(--muted); font-size:12px; } .card .v { font-size:26px; font-weight:700; }
  /* felkoder */
  .faults { display:flex; flex-direction:column; gap:7px; }
  .fault { padding:10px 12px; border-radius:9px; background:var(--card2); border-left:4px solid var(--warn); }
  .fault.current { border-left-color:var(--err); } .fault .tag { font-size:11px; color:var(--muted); margin-left:6px; }
  .none { color:var(--muted); }
  /* knappar */
  .btns { display:flex; flex-wrap:wrap; gap:8px; }
  .btn { flex:1; min-width:calc(50% - 4px); padding:13px 10px; border-radius:11px; border:1px solid var(--line);
    background:var(--card); color:var(--fg); font-size:14px; font-weight:600; cursor:pointer; }
  .btn:active { background:var(--card2); } .btn.warn { border-color:var(--warn); color:var(--warn); }
  .btn.wide { min-width:100%; }
  .cmd { margin-top:8px; font-size:13px; min-height:18px; } .cmd.ok { color:var(--ok); } .cmd.bad { color:var(--err); }
  .err { color:var(--err); font-size:13px; margin-top:8px; }
  /* bil ovanifrån */
  .carwrap { display:flex; justify-content:center; }
  #car { width:100%; max-width:320px; }
  #car .body { fill:var(--card); stroke:var(--line); stroke-width:2; }
  #car .abs { fill:var(--card2); stroke:#3a4652; stroke-width:1.5; }
  #car .wheel { fill:#0b0e13; stroke:#3a4652; stroke-width:1.5; }
  #car .lbl { fill:var(--muted); font-size:9px; } #car .val { fill:var(--fg); font-size:12px; font-weight:700; }
  #car .val2 { fill:var(--accent); font-size:10px; } #car .cap { fill:var(--muted); font-size:8px; text-transform:uppercase; letter-spacing:.5px; }
  footer { color:var(--muted); font-size:11px; text-align:center; padding:16px; }
</style>

<header>
  <h1 id="title">Discovery 2</h1>
  <span class="pill"><span id="dot" class="dot connecting"></span><span id="status">ansluter…</span></span>
</header>

<div class="tabs">
  <div class="tab active" data-tab="motor">Motor</div>
  <div class="tab" data-tab="slabs">SLABS</div>
</div>

<main>
  <!-- ===================== MOTOR ===================== -->
  <div class="view active" id="view-motor">
    <div id="motor-hint" class="hint">Väntar på motordata… (kör dashboarden mot Td5)</div>
    <div id="motor-body" style="display:none">
      <div class="hero" id="hero"></div>
      <section><h2>Alla signaler</h2><div class="grid" id="signals"></div></section>
      <section>
        <h2>Felkoder</h2>
        <div class="btns"><button class="btn wide warn" data-cmd="clear_faults" data-confirm="Radera lagrade felkoder i ECU:n?">Radera felkoder</button></div>
        <div class="faults" id="m_faults" style="margin-top:10px"></div>
      </section>
    </div>
  </div>

  <!-- ===================== SLABS ===================== -->
  <div class="view" id="view-slabs">
    <div id="slabs-hint" class="hint">Väntar på SLABS-data… (kör med <code>--slabs</code>)</div>
    <div id="slabs-body" style="display:none">
      <section>
        <h2>Bilen ovanifrån</h2>
        <div class="carwrap">
        <svg id="car" viewBox="0 0 200 340" xmlns="http://www.w3.org/2000/svg">
          <text class="cap" x="100" y="12" text-anchor="middle">Fram</text>
          <rect class="body" x="46" y="20" width="108" height="300" rx="20"/>
          <!-- hjul -->
          <rect class="wheel" x="24" y="46" width="24" height="52" rx="6"/>
          <rect class="wheel" x="152" y="46" width="24" height="52" rx="6"/>
          <rect class="wheel" x="24" y="242" width="24" height="52" rx="6"/>
          <rect class="wheel" x="152" y="242" width="24" height="52" rx="6"/>
          <!-- ABS-modulator (mitten fram = motorrummet) -->
          <rect class="abs" x="66" y="34" width="68" height="46" rx="8"/>
          <text class="cap" x="100" y="49" text-anchor="middle">ABS-block</text>
          <text class="val2" id="c_abs" x="100" y="66" text-anchor="middle">–</text>
          <!-- hjuldata -->
          <text class="lbl" x="30" y="112">VF</text><text class="val" id="c_fl_s" x="30" y="126">–</text><text class="val2" id="c_fl_v" x="30" y="138">–</text>
          <text class="lbl" x="158" y="112">HF</text><text class="val" id="c_fr_s" x="158" y="126">–</text><text class="val2" id="c_fr_v" x="158" y="138">–</text>
          <text class="lbl" x="30" y="228">VB</text><text class="val" id="c_rl_s" x="30" y="242">–</text><text class="val2" id="c_rl_v" x="30" y="254">–</text>
          <text class="lbl" x="158" y="228">HB</text><text class="val" id="c_rr_s" x="158" y="242">–</text><text class="val2" id="c_rr_v" x="158" y="254">–</text>
          <!-- höjder (luftfjädring) -->
          <text class="cap" x="100" y="176" text-anchor="middle">Höjd (luftfjädring)</text>
          <text class="val" id="c_h_l" x="76" y="196" text-anchor="middle">–</text>
          <text class="val" id="c_h_r" x="124" y="196" text-anchor="middle">–</text>
          <text class="lbl" x="76" y="208" text-anchor="middle">vänster</text>
          <text class="lbl" x="124" y="208" text-anchor="middle">höger</text>
        </svg>
        </div>
      </section>

      <section>
        <h2>ABS-block</h2>
        <div class="btns">
          <button class="btn warn" data-cmd="pump_on" data-confirm="Aktivera ABS-pumpen?">Pump på</button>
          <button class="btn" data-cmd="pump_off">Pump av</button>
        </div>
        <h2 style="margin-top:14px">Ventiltest per hjul ⚠️</h2>
        <div class="btns">
          <button class="btn warn" data-cmd="wheel_fl" data-confirm="Ventiltest vänster fram?">VF</button>
          <button class="btn warn" data-cmd="wheel_fr" data-confirm="Ventiltest höger fram?">HF</button>
          <button class="btn warn" data-cmd="wheel_rl" data-confirm="Ventiltest vänster bak?">VB</button>
          <button class="btn warn" data-cmd="wheel_rr" data-confirm="Ventiltest höger bak?">HB</button>
        </div>
      </section>

      <section>
        <h2>Luftfjädring ⚠️</h2>
        <div class="btns">
          <button class="btn warn" data-cmd="raise_left" data-confirm="Höj vänster?">Höj vä</button>
          <button class="btn warn" data-cmd="lower_left" data-confirm="Sänk vänster?">Sänk vä</button>
          <button class="btn warn" data-cmd="raise_right" data-confirm="Höj höger?">Höj hö</button>
          <button class="btn warn" data-cmd="lower_right" data-confirm="Sänk höger?">Sänk hö</button>
        </div>
        <div class="btns" style="margin-top:8px">
          <button class="btn warn" data-cmd="compressor" data-confirm="Kör kompressorn?">Kompressor</button>
          <button class="btn warn" data-cmd="exhaust" data-confirm="Öppna avluftningsventilen?">Avluft</button>
          <button class="btn" data-cmd="buzzer">🔔 Summer</button>
        </div>
      </section>

      <section>
        <h2>Felkoder</h2>
        <div class="btns"><button class="btn wide warn" data-cmd="clear_faults" data-confirm="Radera SLABS-felkoder?">Radera felkoder</button></div>
        <div class="faults" id="s_faults" style="margin-top:10px"></div>
      </section>
    </div>
  </div>

  <div id="cmdResult" class="cmd"></div>
  <div class="err" id="error"></div>
</main>
<footer>Realtid via SSE · discovery2-diag</footer>

<script>
  const $ = id => document.getElementById(id);
  const fmt = x => (Math.abs(x) >= 100 ? Math.round(x) : x.toFixed(1));
  const LABELS = {
    rpm:"Varvtal", speed:"Fart", battery:"Batteri", coolant_temp:"Kylvätska",
    air_temp:"Insugsluft", fuel_temp:"Bränsle", manifold_press:"Grenrörstryck",
    ambient_press_1:"Omgivningstryck", maf_raw:"MAF (rå)", rpm_error:"Varvfel",
    balance_1:"Injektor 1", balance_2:"Injektor 2", balance_3:"Injektor 3",
    balance_4:"Injektor 4", balance_5:"Injektor 5",
    height_left_mm:"Höjd vänster", height_right_mm:"Höjd höger",
  };
  const HERO = ["rpm","speed","coolant_temp","battery"];

  // ---- flikar ----
  let activeTab = "motor";
  document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
    activeTab = t.dataset.tab;
    document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === t));
    document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + activeTab));
  });

  function render(d) {
    const st = d.status || "connecting";
    $("dot").className = "dot " + st;
    $("status").textContent = ({connected:"ansluten",connecting:"ansluter…",error:"fel"}[st] || st) + (d.source ? " · " + d.source : "");
    $("error").textContent = d.error || "";
    const sig = d.signals || {}, faults = d.faults || [];
    const isSlabs = (d.source || "").indexOf("slabs") >= 0;
    // auto-hoppa till rätt flik första gången data kommer
    if (!render._picked && st === "connected") { render._picked = true;
      document.querySelector(`.tab[data-tab="${isSlabs?'slabs':'motor'}"]`).click(); }
    if (isSlabs) renderSlabs(sig, faults); else renderMotor(sig, faults);
  }

  function renderMotor(sig, faults) {
    $("motor-hint").style.display = Object.keys(sig).length ? "none" : "";
    $("motor-body").style.display = Object.keys(sig).length ? "" : "none";
    $("hero").innerHTML = HERO.map(k => { const s = sig[k]; if (!s) return "";
      return `<div class="card"><div class="k">${LABELS[k]||k}</div><div class="v">${fmt(s.v)}<span class="u"> ${s.u||""}</span></div></div>`; }).join("");
    $("signals").innerHTML = Object.keys(sig).sort().map(k => { const s = sig[k];
      const cls = (s.s==="low"||s.s==="high") ? " s-"+s.s : "";
      return `<div class="row"><span class="n">${LABELS[k]||k}</span><span class="val${cls}">${fmt(s.v)} <span class="u">${s.u||""}</span></span></div>`; }).join("") || '<span class="none">—</span>';
    $("m_faults").innerHTML = faultHtml(faults);
  }

  function setT(id, v) { const e = $(id); if (e) e.textContent = v; }
  function renderSlabs(sig, faults) {
    $("slabs-hint").style.display = Object.keys(sig).length ? "none" : "";
    $("slabs-body").style.display = Object.keys(sig).length ? "" : "none";
    for (const w of ["fl","fr","rl","rr"]) {
      const s = sig["speed_"+w], v = sig["volt_"+w];
      setT("c_"+w+"_s", s ? fmt(s.v)+"" : "–");
      setT("c_"+w+"_v", v ? v.v.toFixed(2)+"V" : "–");
    }
    setT("c_h_l", sig.height_left ? fmt(sig.height_left.v) : "–");
    setT("c_h_r", sig.height_right ? fmt(sig.height_right.v) : "–");
    const cur = faults.filter(f => /current/i.test(f)).length;
    setT("c_abs", faults.length ? (cur ? cur+" aktiva" : faults.length+" loggade") : "OK");
    $("s_faults").innerHTML = faultHtml(faults);
  }

  function faultHtml(faults) {
    if (!faults.length) return '<span class="none">Inga felkoder</span>';
    return faults.map(f => { const cur = /current/i.test(f);
      const tag = f.match(/\(([^)]+)\)\s*$/), name = f.replace(/\s*\([^)]+\)\s*$/, "");
      return `<div class="fault ${cur?'current':'logged'}">${name}<span class="tag">${tag?tag[1]:""}</span></div>`; }).join("");
  }

  function showCmd(msg, ok) { const el = $("cmdResult"); el.textContent = msg; el.className = "cmd " + (ok?"ok":"bad");
    setTimeout(() => { el.textContent = ""; el.className = "cmd"; }, 5000); }

  document.querySelectorAll("[data-cmd]").forEach(btn => btn.onclick = async () => {
    if (btn.dataset.confirm && !confirm(btn.dataset.confirm + "\n(Stillastående, tändning på.)")) return;
    btn.disabled = true;
    try {
      const r = await fetch("/command", { method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ action: btn.dataset.cmd }) });
      const d = await r.json();
      showCmd(d.ok ? (d.message || "Klart") : ("Fel: " + (d.error || "okänt")), !!d.ok);
    } catch (e) { showCmd("Nätverksfel: " + e, false); }
    btn.disabled = false;
  });

  (function connect() {
    const es = new EventSource("/events");
    es.onmessage = e => { try { render(JSON.parse(e.data)); } catch(_){} };
    es.onerror = () => { $("dot").className = "dot connecting"; $("status").textContent = "återansluter…"; };
  })();
</script>
