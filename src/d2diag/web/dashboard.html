<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discovery 2 · Td5 diagnostik</title>
<style>
  :root { --bg:#0f1216; --card:#1a1f27; --card2:#212833; --fg:#e7edf3; --muted:#8b97a7;
          --accent:#4aa3ff; --ok:#37d67a; --warn:#f5a623; --err:#ff5b5b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:14px 18px;
           border-bottom:1px solid #2a3240; position:sticky; top:0; background:var(--bg); z-index:2; }
  header h1 { font-size:16px; margin:0; font-weight:600; letter-spacing:.3px; }
  .pill { display:inline-flex; align-items:center; gap:7px; font-size:12px; color:var(--muted);
          margin-left:auto; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--muted); }
  .dot.connected { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  .dot.connecting { background:var(--warn); }
  .dot.error { background:var(--err); }
  main { padding:16px; max-width:1000px; margin:0 auto; }
  .hero { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid #262e3a; border-radius:14px; padding:14px 16px; }
  .card .k { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .card .v { font-size:30px; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums; }
  .card .u { font-size:13px; color:var(--muted); font-weight:500; margin-left:4px; }
  .card.rpm .v { font-size:44px; color:var(--accent); }
  section { margin-top:22px; }
  section h2 { font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px;
               margin:0 0 10px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
  .row { background:var(--card2); border-radius:10px; padding:9px 12px; display:flex;
         justify-content:space-between; align-items:baseline; }
  .row .n { font-size:13px; color:var(--muted); }
  .row .val { font-variant-numeric:tabular-nums; font-weight:600; }
  .faults { display:flex; flex-direction:column; gap:8px; }
  .fault { padding:10px 13px; border-radius:10px; background:var(--card2);
           border-left:4px solid var(--muted); font-size:14px; }
  .fault.current { border-left-color:var(--err); }
  .fault.logged { border-left-color:var(--warn); }
  .fault .tag { font-size:11px; color:var(--muted); margin-left:8px; }
  .none { color:var(--muted); font-size:14px; }
  .s-high { color:var(--err) !important; }
  .s-low { color:var(--warn) !important; }
  .anom { display:flex; flex-wrap:wrap; gap:8px; }
  .anom .item { padding:8px 12px; border-radius:10px; background:var(--card2);
                border-left:4px solid var(--warn); font-size:14px; font-variant-numeric:tabular-nums; }
  .anom .item.high { border-left-color:var(--err); }
  .anom .item .arrow { font-size:11px; color:var(--muted); margin-left:6px; }
  .schema { background:var(--card); border:1px solid #262e3a; border-radius:14px; padding:8px; overflow-x:auto; }
  #engine { width:100%; min-width:560px; height:auto; display:block; }
  #engine .box, #engine .block { fill:var(--card2); stroke:#3a4652; stroke-width:1.5; }
  #engine .block { fill:#1c232e; }
  #engine .cyl { fill:#2a3340; stroke:#3a4652; stroke-width:1; }
  #engine .lbl { fill:var(--muted); font-size:11px; }
  #engine .val { fill:var(--fg); font-size:15px; font-weight:700; }
  #engine .val2 { fill:var(--accent); font-size:12px; font-weight:600; }
  #engine .flow line { stroke:#5b6b80; stroke-width:2; }
  #engine .fault .box, #engine rect.fault { stroke:var(--err); stroke-width:2.5; }
  #engine .fault .val, #engine .fault .lbl { fill:var(--err); }
  .btn { font-size:12px; font-weight:600; color:var(--fg); background:var(--card2);
         border:1px solid #3a4652; border-radius:8px; padding:5px 11px;
         margin-left:10px; cursor:pointer; }
  .btn:hover { border-color:var(--accent); color:var(--accent); }
  .btn:disabled { opacity:.5; cursor:default; }
  .cmd { font-size:13px; margin-top:10px; min-height:18px; }
  .cmd.ok { color:var(--ok); }
  .cmd.bad { color:var(--err); }
  .err { color:var(--err); font-size:13px; margin-top:8px; }
  footer { color:var(--muted); font-size:11px; text-align:center; padding:20px; }
</style>
</head>
<body>
<header>
  <h1>Discovery 2 · Td5</h1>
  <span class="pill"><span id="dot" class="dot connecting"></span><span id="status">ansluter…</span></span>
</header>
<main>
  <div class="hero" id="hero"></div>
  <section>
    <h2>Avvikelser</h2>
    <div class="anom" id="anom"></div>
  </section>
  <section>
    <h2>Motorschema</h2>
    <div class="schema">
    <svg viewBox="0 0 720 380" id="engine" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="ar--" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#5b6b80"/>
        </marker>
      </defs>
      <!-- luftflöde -->
      <g class="flow">
        <line x1="150" y1="52" x2="196" y2="52" marker-end="url(#ar--)"/>
        <line x1="288" y1="52" x2="322" y2="52" marker-end="url(#ar--)"/>
        <line x1="432" y1="52" x2="470" y2="52" marker-end="url(#ar--)"/>
        <line x1="580" y1="80" x2="580" y2="150" marker-end="url(#ar--)"/>
      </g>
      <!-- insug / MAF-IAT (highlightas vid fel) -->
      <g id="node_intake">
        <rect class="box" x="16" y="28" width="134" height="48" rx="8"/>
        <text class="lbl" x="24" y="45">Insug · MAF/IAT</text>
        <text class="val" id="e_air_temp" x="24" y="66">–</text>
        <text class="val2" id="e_maf" x="96" y="66">–</text>
      </g>
      <!-- turbo -->
      <rect class="box" x="196" y="28" width="92" height="48" rx="8"/>
      <text class="lbl" x="204" y="45">Turbo</text>
      <text class="val" id="e_boost" x="204" y="66">–</text>
      <!-- intercooler -->
      <rect class="box" x="322" y="28" width="110" height="48" rx="8"/>
      <text class="lbl" x="330" y="45">Intercooler</text>
      <!-- grenrör -->
      <rect class="box" x="470" y="28" width="220" height="48" rx="8"/>
      <text class="lbl" x="478" y="45">Grenrör (MAP)</text>
      <text class="val" id="e_map" x="478" y="66">–</text>
      <!-- motorblock -->
      <rect class="block" x="150" y="150" width="470" height="150" rx="12"/>
      <text class="lbl" x="164" y="172">Motorblock</text>
      <text class="val2" id="e_coolant" x="164" y="286">kyl –</text>
      <text class="val2" id="e_fuel" x="270" y="286">bränsle –</text>
      <text class="val2" id="e_rpm" x="470" y="286">– rpm</text>
      <!-- 5 cylindrar / injektorer -->
      <g id="cyls"></g>
      <!-- batteri -->
      <rect class="box" x="16" y="150" width="110" height="48" rx="8"/>
      <text class="lbl" x="24" y="167">Batteri</text>
      <text class="val" id="e_batt" x="24" y="188">–</text>
    </svg>
    </div>
  </section>
  <section>
    <h2>Alla signaler</h2>
    <div class="grid" id="signals"></div>
  </section>
  <section>
    <h2>Felkoder <button id="clearBtn" class="btn" title="Radera lagrade felkoder i ECU:n">Radera felkoder</button></h2>
    <div class="faults" id="faults"></div>
    <div id="cmdResult" class="cmd"></div>
  </section>
  <div class="err" id="error"></div>
</main>
<footer>Uppdateras i realtid via SSE · discovery2-diag</footer>
<script>
  const LABELS = {
    rpm:"Varvtal", speed:"Fart", battery:"Batteri", coolant_temp:"Kylvätska",
    air_temp:"Insugsluft", fuel_temp:"Bränsle", ext_temp:"Omgivning",
    manifold_press:"Grenrörstryck", ambient_press_1:"Omgivningstryck",
    ambient_press_2:"Tryck 2", maf_raw:"MAF (rå)", rpm_error:"Varvfel",
    pedal_track1:"Pedal 1", pedal_track2:"Pedal 2", pedal_demand:"Pedalbegäran",
    pedal_supply:"Pedal 5V", balance_1:"Injektor 1", balance_2:"Injektor 2",
    balance_3:"Injektor 3", balance_4:"Injektor 4", balance_5:"Injektor 5",
  };
  const HERO = ["rpm","speed","coolant_temp","__boost","battery"];
  const $ = id => document.getElementById(id);
  const fmt = x => (Math.abs(x) >= 100 ? Math.round(x) : x.toFixed(1));

  function heroCard(key, sig) {
    let label, value, unit, vcls = "";
    if (key === "__boost") {
      const m = sig.manifold_press, a = sig.ambient_press_1;
      if (!m) return "";
      const boost = a ? (m.v - a.v) : m.v;
      label = "Laddtryck"; value = boost.toFixed(2); unit = "bar";
    } else {
      const s = sig[key]; if (!s) return "";
      label = LABELS[key] || key; value = fmt(s.v); unit = s.u || "";
      if (s.s === "low" || s.s === "high") vcls = " s-" + s.s;
    }
    const cls = key === "rpm" ? "card rpm" : "card";
    return `<div class="${cls}"><div class="k">${label}</div>
            <div class="v${vcls}">${value}<span class="u">${unit}</span></div></div>`;
  }

  function render(d) {
    const st = d.status || "connecting";
    $("dot").className = "dot " + st;
    $("status").textContent = ({connected:"ansluten",connecting:"ansluter…",error:"fel"}[st] || st)
        + (d.source ? " · " + d.source : "");
    $("error").textContent = d.error || "";
    const sig = d.signals || {};
    $("hero").innerHTML = HERO.map(k => heroCard(k, sig)).join("");
    updateEngine(sig, d.faults || []);
    // avvikelser (signaler utanför driftsintervallet)
    const anoms = Object.keys(sig).filter(k => sig[k].s === "low" || sig[k].s === "high").sort();
    $("anom").innerHTML = anoms.length ? anoms.map(k => {
      const s = sig[k];
      return `<div class="item ${s.s}">${LABELS[k]||k}: <b>${fmt(s.v)} ${s.u||""}</b>` +
             `<span class="arrow">${s.s === "high" ? "▲ högt" : "▼ lågt"}</span></div>`;
    }).join("") : '<span class="none">Inga avvikelser</span>';
    $("signals").innerHTML = Object.keys(sig).sort().map(k => {
      const s = sig[k];
      const cls = (s.s === "low" || s.s === "high") ? " s-" + s.s : "";
      return `<div class="row"><span class="n">${LABELS[k]||k}</span>
              <span class="val${cls}">${fmt(s.v)} <span class="u">${s.u||""}</span></span></div>`;
    }).join("") || '<span class="none">—</span>';
    const faults = d.faults || [];
    $("faults").innerHTML = faults.length ? faults.map(f => {
      const cur = /current/i.test(f);
      const tagMatch = f.match(/\(([^)]+)\)\s*$/);
      const name = f.replace(/\s*\([^)]+\)\s*$/, "");
      return `<div class="fault ${cur?'current':'logged'}">${name}
              <span class="tag">${tagMatch?tagMatch[1]:""}</span></div>`;
    }).join("") : '<span class="none">Inga aktiva felkoder</span>';
  }

  // bygg 5 cylindrar/injektorer i motorblocket (en gång)
  (function buildCylinders() {
    const g = document.getElementById("cyls");
    for (let i = 0; i < 5; i++) {
      const x = 172 + i * 90;
      g.insertAdjacentHTML("beforeend",
        `<rect class="cyl" x="${x}" y="190" width="76" height="72" rx="6"/>` +
        `<text class="lbl" x="${x+11}" y="210">Inj ${i+1}</text>` +
        `<text class="val2" id="e_inj${i+1}" x="${x+11}" y="236">–</text>`);
    }
  })();

  function setText(id, txt) { const el = document.getElementById(id); if (el) el.textContent = txt; }

  function updateEngine(sig, faults) {
    const air = sig.air_temp, maf = sig.maf_raw, map = sig.manifold_press, amb = sig.ambient_press_1;
    setText("e_air_temp", air ? `${fmt(air.v)}°C` : "–");
    setText("e_maf", maf ? `MAF ${fmt(maf.v)}` : "");
    setText("e_map", map ? `${map.v.toFixed(2)} bar` : "–");
    setText("e_boost", (map && amb) ? `+${(map.v-amb.v).toFixed(2)}` : (map ? map.v.toFixed(2) : "–"));
    setText("e_coolant", sig.coolant_temp ? `kyl ${fmt(sig.coolant_temp.v)}°C` : "kyl –");
    setText("e_fuel", sig.fuel_temp ? `bränsle ${fmt(sig.fuel_temp.v)}°C` : "bränsle –");
    setText("e_rpm", sig.rpm ? `${Math.round(sig.rpm.v)} rpm` : "– rpm");
    setText("e_batt", sig.battery ? `${sig.battery.v.toFixed(1)} V` : "–");
    for (let i = 1; i <= 5; i++) {
      const b = sig["balance_" + i];
      setText("e_inj" + i, b ? (b.v > 0 ? "+" : "") + b.v.toFixed(1) : "–");
    }
    const faulted = (faults || []).some(f => /inlet air temp|air flow/i.test(f));
    document.getElementById("node_intake").classList.toggle("fault", faulted);
  }

  function connect() {
    const es = new EventSource("/events");
    es.onmessage = e => { try { render(JSON.parse(e.data)); } catch(_) {} };
    es.onerror = () => { $("dot").className = "dot connecting"; $("status").textContent = "återansluter…"; };
  }
  connect();

  function showCmd(msg, ok) {
    const el = $("cmdResult");
    el.textContent = msg;
    el.className = "cmd " + (ok ? "ok" : "bad");
    setTimeout(() => { el.textContent = ""; el.className = "cmd"; }, 5000);
  }

  $("clearBtn").onclick = async () => {
    if (!confirm("Radera lagrade felkoder i ECU:n?\n(Aktuella fel som fortfarande föreligger kommer tillbaka.)")) return;
    const btn = $("clearBtn");
    btn.disabled = true; btn.textContent = "Raderar…";
    try {
      const r = await fetch("/command", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "clear_faults" }),
      });
      const d = await r.json();
      showCmd(d.ok ? (d.message || "Klart") : ("Fel: " + (d.error || "okänt")), !!d.ok);
    } catch (e) {
      showCmd("Nätverksfel: " + e, false);
    }
    btn.disabled = false; btn.textContent = "Radera felkoder";
  };
</script>
</body>
</html>
